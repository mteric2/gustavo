<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/869dc8f5ef.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
    <!-- Script de reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <title>Login CSS</title>
  </head>
  <body>
    <div class="container" id="container">
      <div class="form-container sign-up-container">
        <form action="registro.php" method="POST">
          <h1>Crea tu Cuenta</h1>
          <div class="social-container">
            <a href="#" class="social">
              <i class="fab fa-facebook-f"></i>
            </a>
            <a href="#" class="social">
              <i class="fab fa-google" id="red"></i>
            </a>
            <a href="#" class="social">
              <i class="fab fa-linkedin-in"></i>
            </a>
          </div>
          <span>o usa tu email como registro</span>
          <input type="text" name="nombre" placeholder="Nombre" required />
          <input type="email" name="email" placeholder="Email" required />
          <input type="password" name="password" placeholder="Password" required />
          <!-- Widget de reCAPTCHA -->
          <div class="g-recaptcha" data-sitekey="6Le-Be0qAAAAAEpeWXs4f2xES4leGE0eJkA0SwGs"></div>
          <button id="lila" type="submit">Registrar</button>
          <script>
            document.getElementById('lila').addEventListener('click', function(event) {
              event.preventDefault(); // Evita que el formulario se envíe
              window.location.href = 'index.html'; // Redirige a la página principal
            });
          </script>
        </form>
      </div>
      <div class="form-container sign-in-container">
        <form id="loginForm">
          <h1>Iniciar Sesión</h1>
          <div class="social-container">
            <a href="#" class="social">
              <i class="fab fa-facebook-f"></i>
            </a>
            <a href="#" class="social">
              <i class="fab fa-google" id="red"></i>
            </a>
            <a href="#" class="social">
              <i class="fab fa-linkedin-in"></i>
            </a>
          </div>
          <span>o usa tu email</span>
          <input type="email" name="email" placeholder="Email" required />
          <input type="password" name="password" placeholder="Password" required />
          <!-- Widget de reCAPTCHA -->
          <div class="g-recaptcha" data-sitekey="6Le-Be0qAAAAAEpeWXs4f2xES4leGE0eJkA0SwGs"></div>
          <a href="recuperacion.html">Olvidaste tu contraseña?</a>
          <button type="button" id="loginBtn">Iniciar sesión</button>
        </form>
        <script>
          document.getElementById('loginBtn').addEventListener('click', function() {
            // Redirigir directamente a index.html sin validar ni enviar datos
            window.location.href = 'index.html';
          });
        </script>
      </div>
      <div class="overlay-container">
        <div class="overlay">
          <div class="overlay-panel overlay-left">
            <h1>¡Bienvenido!</h1>
            <p>Inicia sesión con tu cuenta</p>
            <button class="ghost" id="signIn">Inicia sesión</button>
          </div>
          <div class="overlay-panel overlay-right">
            <h1>Hola!!!</h1>
            <p>Crear tu cuenta</p>
            <button class="ghost" id="signUp">Registrar</button>
          </div>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
